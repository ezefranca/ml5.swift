name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/documentation.yml"
      - "Package.swift"
      - "Scripts/**"
      - "Sources/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      pages-configuration: ${{ steps.pages.outcome }}
    env:
      P5_DOCUMENTATION_BASE_URL: https://ezefranca.com/p5.swift
      P5_HOSTING_BASE_PATH: p5.swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true

      - name: Build DocC archives
        env:
          P5_DERIVED_DATA_ROOT: ${{ runner.temp }}/P5DerivedData
        run: |
          for TARGET in P5 Matter ML5; do
            xcodebuild docbuild \
              -scheme "$TARGET" \
              -destination 'generic/platform=macOS' \
              -derivedDataPath "$P5_DERIVED_DATA_ROOT/$TARGET" \
              CODE_SIGNING_ALLOWED=NO \
              SWIFT_SUPPRESS_WARNINGS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              DOCC_WARNINGS_AS_ERRORS=YES \
              DOCC_HOSTING_BASE_PATH="$P5_HOSTING_BASE_PATH"
          done

      - name: Transform archive for static hosting
        env:
          P5_DERIVED_DATA_ROOT: ${{ runner.temp }}/P5DerivedData
          P5_DOCUMENTATION_SITE: ${{ runner.temp }}/P5Documentation
          P5_DOCUMENTATION_EXPORTS: ${{ runner.temp }}/P5DocumentationExports
        run: |
          mkdir -p "$P5_DOCUMENTATION_SITE" "$P5_DOCUMENTATION_EXPORTS"
          for TARGET in P5 Matter ML5; do
            xcrun docc process-archive transform-for-static-hosting \
              "$P5_DERIVED_DATA_ROOT/$TARGET/Build/Products/Debug/$TARGET.doccarchive" \
              --output-path "$P5_DOCUMENTATION_EXPORTS/$TARGET" \
              --hosting-base-path "$P5_HOSTING_BASE_PATH"
            ditto "$P5_DOCUMENTATION_EXPORTS/$TARGET" "$P5_DOCUMENTATION_SITE"
          done

          P5_VERSION=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo unreleased)
          python3 Scripts/prepare_documentation_site.py \
            --site "$P5_DOCUMENTATION_SITE" \
            --base-url "$P5_DOCUMENTATION_BASE_URL" \
            --version "$P5_VERSION" \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY"

      - name: Verify multi-product documentation routes
        env:
          P5_DOCUMENTATION_SITE: ${{ runner.temp }}/P5Documentation
        run: |
          test -f "$P5_DOCUMENTATION_SITE/documentation/p5/index.html"
          test -f "$P5_DOCUMENTATION_SITE/documentation/matter/index.html"
          test -f "$P5_DOCUMENTATION_SITE/documentation/ml5/index.html"
          test -f "$P5_DOCUMENTATION_SITE/data/documentation/p5.json"
          test -f "$P5_DOCUMENTATION_SITE/data/documentation/matter.json"
          test -f "$P5_DOCUMENTATION_SITE/data/documentation/ml5.json"

      - name: Validate internal and external references
        run: python3 Scripts/check_links.py --online

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/P5Documentation

  deploy:
    name: Deploy DocC site
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages-configuration == 'success'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
