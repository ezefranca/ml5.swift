name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/documentation.yml"
      - "Package.swift"
      - "Scripts/**"
      - "Sources/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      pages-configuration: ${{ steps.pages.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
      - name: Resolve documentation identity
        id: package
        run: |
          PRODUCT=$(python3 -c 'import json; print(next(iter(json.load(open("Configuration/ModuleBoundaries.json"))["products"])))')
          REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "slug=$(printf '%s' "$PRODUCT" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          echo "base_url=https://ezefranca.com/$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
      - name: Build DocC archive
        env:
          PRODUCT: ${{ steps.package.outputs.product }}
        run: |
          xcodebuild docbuild \
            -scheme "$PRODUCT" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            DOCC_WARNINGS_AS_ERRORS=YES \
            DOCC_HOSTING_BASE_PATH="${{ steps.package.outputs.repository }}"
      - name: Transform archive for static hosting
        env:
          BASE_URL: ${{ steps.package.outputs.base_url }}
          PRODUCT: ${{ steps.package.outputs.product }}
          REPOSITORY_NAME: ${{ steps.package.outputs.repository }}
        run: |
          SITE="${{ runner.temp }}/Documentation"
          xcrun docc process-archive transform-for-static-hosting \
            "${{ runner.temp }}/DerivedData/Build/Products/Debug/$PRODUCT.doccarchive" \
            --output-path "$SITE" \
            --hosting-base-path "$REPOSITORY_NAME"
          VERSION=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo unreleased)
          python3 Scripts/prepare_documentation_site.py \
            --site "$SITE" \
            --base-url "$BASE_URL" \
            --version "$VERSION" \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY"
      - name: Verify documentation routes
        run: |
          SITE="${{ runner.temp }}/Documentation"
          test -f "$SITE/documentation/${{ steps.package.outputs.slug }}/index.html"
          test -f "$SITE/data/documentation/${{ steps.package.outputs.slug }}.json"
          test -f "$SITE/llms.txt"
          test -f "$SITE/llms-full.txt"
          test -f "$SITE/agent-context.json"
          test -f "$SITE/sitemap.xml"
      - name: Validate internal and external references
        run: |
          python3 Scripts/check_links.py --online \
            --ignore-prefix "${{ steps.package.outputs.base_url }}/documentation/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/Documentation

  deploy:
    name: Deploy DocC site
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages-configuration == 'success'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
