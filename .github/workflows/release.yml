name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Swift package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and check out release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$TAG"
          git checkout --detach "$TAG"
      - name: Validate release candidate
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bash Scripts/validate_release.sh --tag "$TAG"
      - name: Create source archive and manifest
        id: archive
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          PACKAGE=${GITHUB_REPOSITORY#*/}
          ARCHIVE="${{ runner.temp }}/$PACKAGE-$TAG.zip"
          git archive --format=zip --prefix="$PACKAGE-$TAG/" --output="$ARCHIVE" "$TAG"
          python3 Scripts/create_release_manifest.py \
            --tag "$TAG" \
            --output "${{ runner.temp }}/release-manifest.json" \
            "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" "${{ runner.temp }}/release-manifest.json" > "${{ runner.temp }}/SHA256SUMS"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --verify-tag
          --generate-notes
          --title "${{ steps.archive.outputs.package }} $TAG"
          "${{ steps.archive.outputs.path }}"
          "${{ runner.temp }}/release-manifest.json"
          "${{ runner.temp }}/SHA256SUMS"
