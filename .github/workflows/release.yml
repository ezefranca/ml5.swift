name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish Swift package
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify semantic version tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$TAG"

      - name: Check out release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Build and test
        run: swift test --parallel -Xswiftc -warnings-as-errors

      - name: Build iOS library
        run: >
          xcodebuild build
          -scheme P5
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >
          gh release create "$TAG"
          --verify-tag
          --generate-notes
          --title "p5.swift $TAG"
