name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Package
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run release-quality package validation
        run: bash Scripts/validate.sh --skip-xcode

  product-build:
    name: ${{ matrix.scheme }} · ${{ matrix.platform }} · ${{ matrix.configuration }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scheme: [P5, Matter, ML5]
        platform: [macOS, iOS Simulator]
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build product
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
          SCHEME: ${{ matrix.scheme }}
        run: >-
          xcodebuild build
          -scheme "$SCHEME"
          -configuration "$CONFIGURATION"
          -destination "generic/platform=$PLATFORM"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
